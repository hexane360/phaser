---
name: "mos2_lsqml"
backend: jax

# raw data source
raw_data:
  type: empad
  path: "sample_data/simulated_mos2/mos2_0.00_dstep1.0.json"

post_load:
 - type: poisson
   scale: 6.09e+6  # 1e+6

post_init: []

# for each reconstruction engine
engines:
   # how to transition from previous state to current reconstruction state
   # how to reconstruct
   # how to output/save
 - type: 'conventional'
   probe_modes: 4
   niter: 80
   grouping: 256

   noise_model:
     type: 'anscombe'
     eps: 1.0

   solver:
     type: 'lsqml'
     beta_probe: 0.1
     beta_object: 0.5

     illum_reg_object: 0.01
     illum_reg_probe: 0.0
     gamma: 0.0

   position_solver:
     type: momentum
     # `step_size` is a fraction of the LSQ optimal step
     momentum: 0.9
     step_size: 2.0
     max_step_size: 0.2

   group_constraints:
    - type: clamp_object_amplitude
      amplitude: 1.1
   iter_constraints:
    - remove_phase_ramp
    - type: obj_gaussian
      sigma: 0.2
      weight: 0.1

   update_probe: {after: 5}
   update_positions: {after: 30}

   save: {every: 10}
   save_images: {every: 10}
   save_options:
     images: [
      'probe', 'probe_recip', 'object_phase_sum', 'object_mag_sum'
     ]

 - type: 'conventional'
   probe_modes: 4
   niter: 80
   grouping: 64

   sim_shape: [256, 256]

   noise_model:
     type: 'anscombe'
     eps: 1.0

   solver:
     type: 'lsqml'
     beta_probe: 0.1
     beta_object: 0.5

     illum_reg_object: 0.01
     illum_reg_probe: 0.0
     gamma: 0.0

   position_solver:
     type: momentum
     # `step_size` is a fraction of the LSQ optimal step
     momentum: 0.9
     step_size: 2.0
     max_step_size: 0.2

   group_constraints:
    - type: clamp_object_amplitude
      amplitude: 1.1
   iter_constraints:
    - remove_phase_ramp
    - type: obj_gaussian
      sigma: 0.2
      weight: 0.1

   update_probe: {after: 1}
   update_positions: {after: 30}

   save: {every: 10}
   save_images: {every: 10}
   save_options:
     images: [
      'probe', 'probe_recip', 'object_phase_sum', 'object_mag_sum'
     ]
