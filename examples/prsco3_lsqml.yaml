---
name: "prsco3_lsqml"
backend: jax

# raw data source
raw_data:
  type: empad
  path: "sample_data/experimental_prsco3/PSO.json"

# initialization

post_init:
 - drop_nans
 - diffraction_align

slices:
  n: 21
  total_thickness: 210

engines:
 - type: 'conventional'
   sim_shape: [128, 128]
   probe_modes: 8
   niter: 100
   grouping: 16
   bwlim_frac: 1.0

   noise_model:
     type: 'amplitude'
     eps: 1.0

   solver:
     type: 'lsqml'
     beta_probe: 0.1
     beta_object: 0.5

     gamma: 0.0
     illum_reg_object: 1.0e+5
     illum_reg_probe: 0.0

   position_solver:
     type: momentum
     # `step_size` is a fraction of the LSQ optimal step
     momentum: 0.9
     step_size: 2.0
     max_step_size: 0.2

   group_constraints: []
   iter_constraints:
     - type: limit_probe_support
       max_angle: 22.0
     - type: clamp_object_amplitude
       amplitude: 1.0
     - type: layers
       sigma: 100.0
       weight: 0.8
     - type: obj_gaussian
       sigma: 0.3
       weight: 1.0e-2

   update_probe: {after: 5}
   update_positions: {after: 5}

   save: {every: 10}
   save_images: {every: 10}
   save_options:
     images: [
      'probe', 'probe_recip', 'object_phase_sum', 'object_mag_sum',
      'object_phase_stack', 'object_mag_stack'
     ]
